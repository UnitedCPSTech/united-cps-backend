name: Deploy clients-service to ECS

on:
  push:
    branches: [main]
    paths:
      - 'clients-service/**'
      - '.github/workflows/deploy-clients.yml'
      - '.github/task-definitions/unitedcps-clients-service-revision3.json'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients-service

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: unitedcps/clients-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render Amazon ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/task-definitions/unitedcps-clients-service-revision3.json
          container-name: clients-service
          image: ${{ steps.build-image.outputs.image }}
          environment-variables: |
            MONGO_URI=${{ secrets.MONGO_URI_CLIENTS }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: clients-service
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true